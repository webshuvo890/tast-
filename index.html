<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BEright Automation - Inventory Console</title>
  <style>
    :root {
      --bg: #0b0f19;
      --card-bg: rgba(22, 27, 46, 0.7);
      --card-border: rgba(255, 255, 255, 0.1);
      --primary: #00f2fe;
      --accent: #4facfe;
      --success: #00f29b;
      --error: #ff477e;
      --text: #f0f4f8;
      --text-dim: #94a3b8;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
    }

    body {
      background-color: var(--bg);
      background-image: 
        radial-gradient(at 0% 0%, rgba(79, 172, 254, 0.15) 0px, transparent 50%),
        radial-gradient(at 100% 100%, rgba(0, 242, 254, 0.12) 0px, transparent 50%);
      color: var(--text);
      min-height: 100vh;
      padding: 30px 20px;
      display: flex;
      justify-content: center;
    }

    .container {
      width: 100%;
      max-width: 900px;
    }

    header {
      margin-bottom: 25px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 15px;
    }

    .brand h1 {
      font-size: 1.6rem;
      font-weight: 700;
      background: linear-gradient(135deg, var(--primary), var(--accent));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      letter-spacing: 0.5px;
    }

    .brand p {
      font-size: 0.85rem;
      color: var(--text-dim);
      margin-top: 4px;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: rgba(0, 242, 155, 0.1);
      color: var(--success);
      border: 1px solid rgba(0, 242, 155, 0.3);
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 0.8rem;
      font-weight: 600;
    }

    .badge .dot {
      width: 8px;
      height: 8px;
      background: var(--success);
      border-radius: 50%;
      box-shadow: 0 0 8px var(--success);
    }

    .card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-radius: 14px;
      padding: 24px;
      margin-bottom: 24px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
    }

    .card-title {
      font-size: 1.1rem;
      font-weight: 600;
      margin-bottom: 18px;
      color: #fff;
    }

    form {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 14px;
    }

    .input-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .input-group label {
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--text-dim);
    }

    input {
      background: rgba(11, 15, 25, 0.7);
      border: 1px solid rgba(255, 255, 255, 0.15);
      padding: 10px 14px;
      border-radius: 8px;
      color: #fff;
      font-size: 0.95rem;
      outline: none;
      transition: all 0.2s ease;
    }

    input:focus {
      border-color: var(--primary);
      box-shadow: 0 0 10px rgba(0, 242, 254, 0.25);
    }

    .btn {
      background: linear-gradient(135deg, var(--accent), var(--primary));
      border: none;
      color: #0b0f19;
      font-weight: 700;
      font-size: 0.95rem;
      border-radius: 8px;
      cursor: pointer;
      padding: 12px 20px;
      height: 42px;
      align-self: flex-end;
      transition: transform 0.15s ease, box-shadow 0.2s ease;
    }

    .btn:hover {
      transform: translateY(-1px);
      box-shadow: 0 4px 15px rgba(0, 242, 254, 0.4);
    }

    .btn:disabled {
      opacity: 0.6;
      cursor: not-allowed;
      transform: none;
    }

    .table-header-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
    }

    .refresh-btn {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--card-border);
      color: var(--text-dim);
      border-radius: 6px;
      padding: 6px 12px;
      font-size: 0.8rem;
      cursor: pointer;
      transition: background 0.2s ease;
    }

    .refresh-btn:hover {
      background: rgba(255, 255, 255, 0.12);
      color: #fff;
    }

    .table-container {
      overflow-x: auto;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      text-align: left;
    }

    th {
      padding: 12px 14px;
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--text-dim);
      border-bottom: 1px solid var(--card-border);
    }

    td {
      padding: 14px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.04);
      font-size: 0.9rem;
    }

    tr:hover td {
      background: rgba(255, 255, 255, 0.02);
    }

    .dept-tag {
      background: rgba(79, 172, 254, 0.15);
      color: var(--accent);
      border-radius: 4px;
      padding: 4px 8px;
      font-size: 0.8rem;
      font-weight: 500;
    }

    .stock-pill {
      font-weight: 700;
      color: var(--primary);
    }

    #statusMessage {
      margin-top: 12px;
      font-size: 0.85rem;
      font-weight: 500;
      display: none;
    }
  </style>
</head>
<body>

  <div class="container">
    <!-- Header -->
    <header>
      <div class="brand">
        <h1>BEright Inventory Console</h1>
        <p>Live Node.js API + Google Sheets Sync</p>
      </div>
      <div class="badge">
        <span class="dot"></span>
        <span id="connectionStatus">API Active</span>
      </div>
    </header>

    <!-- Create Form -->
    <div class="card">
      <div class="card-title">+ Add New Item to Inventory</div>
      <form id="addToolForm">
        <div class="input-group">
          <label>Item Name</label>
          <input type="text" id="toolName" placeholder="e.g. Troptim Saw Blade" required />
        </div>
        <div class="input-group">
          <label>Department</label>
          <input type="text" id="toolDept" placeholder="e.g. Surface Prep / CNC" required />
        </div>
        <div class="input-group">
          <label>Stock Count</label>
          <input type="number" id="toolStock" placeholder="e.g. 25" required min="0" />
        </div>
        <button type="submit" class="btn" id="submitBtn">Save Item</button>
      </form>
      <div id="statusMessage"></div>
    </div>

    <!-- Inventory Table -->
    <div class="card">
      <div class="table-header-row">
        <div class="card-title" style="margin: 0;">Live Inventory Records</div>
        <button class="refresh-btn" id="refreshBtn" onclick="loadInventory()">Refresh</button>
      </div>

      <div class="table-container">
        <table>
          <thead>
            <tr>
              <th>ID</th>
              <th>Item Name</th>
              <th>Department</th>
              <th>Stock</th>
            </tr>
          </thead>
          <tbody id="inventoryBody">
            <tr>
              <td colspan="4" style="text-align: center; color: var(--text-dim); padding: 30px;">
                Loading inventory records...
              </td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>

  <script>
    const inventoryBody = document.getElementById('inventoryBody');
    const form = document.getElementById('addToolForm');
    const submitBtn = document.getElementById('submitBtn');
    const statusMessage = document.getElementById('statusMessage');

    // 1. Fetch & display items from Node.js API
    async function loadInventory() {
      try {
        const response = await fetch('/api/tools');
        const result = await response.json();

        if (result.success && result.data && result.data.length > 0) {
          inventoryBody.innerHTML = '';
          result.data.forEach(item => {
            const tr = document.createElement('tr');
            tr.innerHTML = `
              <td style="color: var(--text-dim);">#${item.id}</td>
              <td style="font-weight: 600; color: #fff;">${item.name}</td>
              <td><span class="dept-tag">${item.department}</span></td>
              <td><span class="stock-pill">${item.stock}</span></td>
            `;
            inventoryBody.appendChild(tr);
          });
        } else {
          inventoryBody.innerHTML = `
            <tr>
              <td colspan="4" style="text-align: center; color: var(--text-dim); padding: 25px;">
                No records found in inventory.
              </td>
            </tr>
          `;
        }
      } catch (err) {
        inventoryBody.innerHTML = `
          <tr>
            <td colspan="4" style="text-align: center; color: var(--error); padding: 25px;">
              Failed to load records. Is the Node.js server running?
            </td>
          </tr>
        `;
      }
    }

    // 2. Submit new tool via POST
    form.addEventListener('submit', async (e) => {
      e.preventDefault();

      const name = document.getElementById('toolName').value.trim();
      const department = document.getElementById('toolDept').value.trim();
      const stock = parseInt(document.getElementById('toolStock').value, 10);

      submitBtn.disabled = true;
      submitBtn.textContent = 'Saving...';
      showStatus('Submitting to Google Sheets...', 'var(--text-dim)');

      try {
        const res = await fetch('/api/tools', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ name, department, stock })
        });

        const resData = await res.json();

        if (resData.success) {
          showStatus('Successfully saved to Google Sheets!', 'var(--success)');
          form.reset();
          loadInventory(); // Reload table automatically
        } else {
          showStatus('Error: ' + resData.message, 'var(--error)');
        }
      } catch (err) {
        showStatus('Network error while saving.', 'var(--error)');
      } finally {
        submitBtn.disabled = false;
        submitBtn.textContent = 'Save Item';
      }
    });

    function showStatus(text, color) {
      statusMessage.style.display = 'block';
      statusMessage.style.color = color;
      statusMessage.textContent = text;
      setTimeout(() => {
        statusMessage.style.display = 'none';
      }, 5000);
    }

    // Load table on page start
    loadInventory();
  </script>
</body>
</html>
